<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="splitCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>

    <linearGradient id="chevronNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06132a" />
      <stop offset="50%" stop-color="#07399d" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc63d" />
      <stop offset="60%" stop-color="#d99a0b" />
      <stop offset="100%" stop-color="#8f5a00" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="-12" dy="16" stdDeviation="24" flood-color="#06132a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#splitCanvas)" />

  <!-- Right Geometric Anchor Chevron (Inspired by Page 6 of reference) -->
  <!-- Outer Large Chevron Frame in Navy/Blue -->
  <path d="M1200 -80 L1450 -80 L1760 480 L1450 1160 L1200 1160 L1510 480 Z" 
        fill="url(#chevronNavy)" 
        filter="url(#softShadow)" />

  <!-- Inner Gold Accent Cutting Chevron -->
  <path d="M1360 -80 L1460 -80 L1720 480 L1460 1160 L1360 1160 L1620 480 Z" 
        fill="url(#goldAccent)" 
        opacity="0.9" />

  <!-- Subtle Top Left Geometric Accent -->
  <path d="M0 0 L240 0 L0 240 Z" fill="#07399d" opacity="0.04" />
  <rect x="0" y="0" width="8" height="1080" fill="#07399d" />
</svg>
