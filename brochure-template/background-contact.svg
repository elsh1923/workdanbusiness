<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky & Twilight Atmosphere Gradients -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040b17" />
      <stop offset="30%" stop-color="#091d3e" />
      <stop offset="60%" stop-color="#142c54" />
      <stop offset="85%" stop-color="#734415" />
      <stop offset="100%" stop-color="#d98218" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1726" />
      <stop offset="35%" stop-color="#06132a" />
      <stop offset="100%" stop-color="#020914" />
    </linearGradient>

    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d99a0b" />
      <stop offset="50%" stop-color="#ffc63d" />
      <stop offset="100%" stop-color="#d99a0b" />
    </linearGradient>

    <linearGradient id="skylineGoldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c28500" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffc63d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c28500" stop-opacity="0.2" />
    </linearGradient>

    <filter id="cityGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect x="0" y="0" width="1920" height="680" fill="url(#nightSky)" />

  <!-- Horizon Warm Glow -->
  <ellipse cx="960" cy="670" rx="900" ry="140" fill="#f59e0b" opacity="0.35" filter="url(#cityGaze)" />

  <!-- Stylized Skyline Silhouette (Dubai / Sharjah Architectural Silhouettes) -->
  <g fill="#050e1c" opacity="0.95">
    <!-- Building clusters -->
    <rect x="60" y="440" width="45" height="240" />
    <polygon points="60,440 82,410 105,440" />
    
    <rect x="130" y="380" width="60" height="300" />
    
    <rect x="220" y="320" width="75" height="360" />
    <rect x="245" y="280" width="25" height="40" />
    
    <rect x="330" y="410" width="55" height="270" />
    
    <rect x="420" y="350" width="80" height="330" />
    <polygon points="420,350 460,300 500,350" />

    <!-- Landmark Tower (Burj-style taper) -->
    <polygon points="640,680 650,220 670,140 672,80 674,140 690,220 700,680" />
    
    <rect x="730" y="310" width="70" height="370" />
    <rect x="830" y="420" width="90" height="260" />
    
    <!-- Mid clusters -->
    <rect x="960" y="360" width="65" height="320" />
    <polygon points="960,360 992,310 1025,360" />
    
    <rect x="1060" y="330" width="85" height="350" />
    <rect x="1170" y="390" width="75" height="290" />
    <rect x="1270" y="280" width="60" height="400" />
    <polygon points="1270,280 1300,230 1330,280" />
    
    <rect x="1350" y="340" width="80" height="340" />
    <rect x="1460" y="310" width="70" height="370" />
    <rect x="1560" y="260" width="95" height="420" />
    <polygon points="1560,260 1607,200 1655,260" />
    
    <rect x="1690" y="380" width="80" height="300" />
    <rect x="1800" y="440" width="60" height="240" />
  </g>

  <!-- Skyline Glowing Windows Effect -->
  <g fill="#ffc63d" opacity="0.6">
    <rect x="235" y="340" width="4" height="6" />
    <rect x="250" y="360" width="4" height="6" />
    <rect x="235" y="400" width="4" height="6" />
    <rect x="668" y="220" width="4" height="8" />
    <rect x="668" y="260" width="4" height="8" />
    <rect x="668" y="320" width="4" height="8" />
    <rect x="1285" y="320" width="4" height="6" />
    <rect x="1305" y="340" width="4" height="6" />
    <rect x="1580" y="300" width="4" height="8" />
    <rect x="1610" y="340" width="4" height="8" />
  </g>

  <!-- Horizon Shoreline Light Streak -->
  <line x1="0" y1="680" x2="1920" y2="680" stroke="url(#skylineGoldGlow)" stroke-width="4" />

  <!-- Calm Water Base & Reflection -->
  <rect x="0" y="680" width="1920" height="400" fill="url(#waterGrad)" />

  <!-- Water Surface Light Shimmers -->
  <g opacity="0.4" stroke="#ffc63d" stroke-linecap="round">
    <line x1="650" y1="710" x2="695" y2="710" stroke-width="3" />
    <line x1="640" y1="740" x2="710" y2="740" stroke-width="2" />
    <line x1="630" y1="790" x2="720" y2="790" stroke-width="1.5" />
    <line x1="1560" y1="715" x2="1640" y2="715" stroke-width="3" />
    <line x1="1550" y1="755" x2="1660" y2="755" stroke-width="2" />
    <line x1="1540" y1="810" x2="1670" y2="810" stroke-width="1.5" />
  </g>

  <!-- Subtle Vignette Frame -->
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#06132a" stroke-width="20" opacity="0.3" />
</svg>
