<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f8" />
    </linearGradient>

    <linearGradient id="navyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06132a" />
      <stop offset="100%" stop-color="#0b2452" />
    </linearGradient>

    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07399d" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc63d" />
      <stop offset="50%" stop-color="#d99a0b" />
      <stop offset="100%" stop-color="#8f5a00" />
    </linearGradient>

    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3" />
      <stop offset="100%" stop-color="#ffc63d" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-8" dy="16" stdDeviation="20" flood-color="#06132a" flood-opacity="0.25" />
    </filter>

    <filter id="shadowGold" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8f5a00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Architectural Lines in Background -->
  <g opacity="0.04" stroke="#07399d" stroke-width="1.5">
    <line x1="0" y1="180" x2="1920" y2="180" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Left Hero Chevron Structure (Workdan Signature Geometry) -->
  <!-- Layer 1: Navy Base Shadow Chevron -->
  <path d="M-80 -80 L460 -80 L760 540 L460 1160 L-80 1160 L220 540 Z" 
        fill="url(#navyDeep)" 
        opacity="0.95" 
        filter="url(#shadowHeavy)" />

  <!-- Layer 2: Royal Blue Facet Accent -->
  <path d="M-50 40 L380 40 L640 540 L380 1040 L-50 1040 L210 540 Z" 
        fill="url(#royalBlue)" 
        opacity="0.8" />

  <!-- Layer 3: Gold Cutting Chevron Ribbon -->
  <path d="M120 -80 L280 -80 L590 540 L280 1160 L120 1160 L430 540 Z" 
        fill="url(#goldGrad)" 
        filter="url(#shadowGold)" />

  <!-- Layer 4: Delicate Gold Accent Pin Stripe -->
  <path d="M295 -80 L320 -80 L620 540 L320 1160 L295 1160 L595 540 Z" 
        fill="url(#goldLightGrad)" 
        opacity="0.9" />

  <!-- Top Right Geometric Corner Accent -->
  <path d="M1680 0 L1920 0 L1920 240 Z" fill="url(#navyDeep)" opacity="0.08" />
  <polygon points="1860,0 1920,0 1920,60" fill="url(#goldGrad)" opacity="0.4" />

  <!-- Bottom Right Subtle Floating Dot Array -->
  <g fill="#07399d" opacity="0.12">
    <circle cx="1780" cy="980" r="4" />
    <circle cx="1810" cy="980" r="4" />
    <circle cx="1840" cy="980" r="4" />
    <circle cx="1870" cy="980" r="4" />
    <circle cx="1780" cy="1010" r="4" />
    <circle cx="1810" cy="1010" r="4" />
    <circle cx="1840" cy="1010" r="4" />
    <circle cx="1870" cy="1010" r="4" />
    <circle cx="1780" cy="1040" r="4" />
    <circle cx="1810" cy="1040" r="4" />
    <circle cx="1840" cy="1040" r="4" />
    <circle cx="1870" cy="1040" r="4" />
  </g>
</svg>
